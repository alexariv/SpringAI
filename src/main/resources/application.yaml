spring:
  jackson:
    serialization:
      indent-output: true
  elasticsearch:
  uris: http://localhost:9200   
  application:
    name: semantic
  ai:
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        options:
          model: qwen3:8b # different models found @ https://ollama.com/library 
          keep-alive: 30m 
          temperature: 0.2 
      embedding:
        enabled: true
        options:
          model: nomic-embed-text  # different models found @ https://ollama.com/library 
          keep-alive: 30m
      
    vectorstore:
      elasticsearch:
        index-name: operation_logs_vector       
        initialize-schema: true        
        dimensions: 768  # must match the dimensions of the embedding model output               
        embedding-field-name: embedding  
        similarity: cosine       
olog:
  base-url: http://localhost:8080/Olog