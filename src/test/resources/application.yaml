spring:
  elasticsearch:
    uris: http://localhost:9200
  application:
    name: semantic
  ai:
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY}
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        chat:
          options:
            deployment-name: gpt-5.4        
        embedding:
          options:
            deployment-name: embed-v-4-0-2
     
    vectorstore:
      elasticsearch:
        index-name: operation_logs_vector_azure_1536
        initialize-schema: true
        dimensions: 1536
        embedding-field-name: embedding
        similarity: cosine
